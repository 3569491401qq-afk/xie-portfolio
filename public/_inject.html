<!doctype html><meta charset="utf-8"><pre id="o">…</pre>
<script type="module">
const o = document.getElementById('o');
const log = (...a) => { o.textContent += "\n" + a.join(" "); };
try {
  const m = await import('/src/worksStore.js');
  const res = await fetch('/works.json');
  const works = await res.json();
  log('取到作品数:', works.length, '第一个:', works[0].slug);
  works[0].detail.media = [
    { type: 'video', src: '/works/_probe-v.mp4', poster: '/works/_probe-poster.jpg' },
    ...(works[0].detail.images || []).slice(0, 2).map(src => ({ type: 'image', src })),
    { type: 'embed', src: 'https://player.bilibili.com/player.html?bvid=BV1xx411c7mD&autoplay=0' },
  ];
  log('注入后 media 条数:', works[0].detail.media.length);
  const r = await m.saveWorks(works);
  log('saveWorks 结果:', JSON.stringify(r));
  const raw = localStorage.getItem('xie-portfolio:works-draft');
  log('localStorage 草稿:', raw ? raw.length + ' 字符' : '(空)');
  if (raw) {
    const parsed = JSON.parse(raw);
    log('草稿里第一个作品的 media 条数:', (parsed[0].detail.media || []).length);
  }
  log('=== done ===');
} catch (e) { log('❌ 出错:', e.message); }
</script>
